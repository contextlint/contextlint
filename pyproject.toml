[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextlint"
version = "0.1.0"
description = "Audit LLM prompt and context spend. Finds recoverable tokens and separates what is provably safe to cut from what needs an eval."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "tokens", "prompt", "cost", "openai", "anthropic", "prompt-caching", "finops", "linter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://contextlint.github.io/contextlint/"
Source = "https://github.com/contextlint/contextlint"
Issues = "https://github.com/contextlint/contextlint/issues"

[project.optional-dependencies]
exact = ["tiktoken>=0.5"]

[project.scripts]
contextlint = "contextlint.cli:main"

[tool.setuptools.packages.find]
include = ["contextlint*"]
